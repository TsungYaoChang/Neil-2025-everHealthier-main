name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create public directory
        run: |
          mkdir -p _site
          # Copy static frontend files
          cp login.html _site/
          cp select-user.html _site/
          cp patient-dashboard.html _site/
          cp patient-dashboard.js _site/
          cp clinic-dashboard.html _site/
          cp clinic.js _site/
          cp common.js _site/
          cp style.css _site/
          cp config.js _site/
          cp article-list.html _site/
          cp article-detail.html _site/
          cp register.html _site/
          cp register-success.html _site/
          
          # Copy assets and public folders
          cp -r assets _site/ 2>/dev/null || true
          
          # Note: public/callback.html stays on Render backend
          # Don't copy public folder to avoid conflicts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

