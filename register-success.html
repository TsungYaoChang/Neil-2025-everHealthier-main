<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊成功 - 醫療監控系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 to-blue-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full text-center">
            <!-- 成功圖示 -->
            <div class="mx-auto h-24 w-24 bg-green-100 rounded-full flex items-center justify-center mb-8">
                <svg class="h-12 w-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <!-- 成功訊息 -->
            <h1 class="text-3xl font-bold text-gray-900 mb-4">註冊成功！</h1>
            <p class="text-lg text-gray-600 mb-8">
                歡迎加入醫療監控系統，我們已將帳號驗證郵件發送到您的信箱。
            </p>

            <!-- 提示卡片 -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8 text-left">
                <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    接下來的步驟
                </h3>
                <div class="space-y-3">
                    <div class="flex items-start">
                        <div class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 flex items-center justify-center text-sm font-semibold mr-3 mt-0.5">1</div>
                        <p class="text-gray-700">檢查您的電子郵件信箱 (包括垃圾郵件資料夾)</p>
                    </div>
                    <div class="flex items-start">
                        <div class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 flex items-center justify-center text-sm font-semibold mr-3 mt-0.5">2</div>
                        <p class="text-gray-700">點擊驗證連結完成帳號啟用</p>
                    </div>
                    <div class="flex items-start">
                        <div class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 flex items-center justify-center text-sm font-semibold mr-3 mt-0.5">3</div>
                        <p class="text-gray-700">返回登入頁面使用您的新帳號登入</p>
                    </div>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div class="space-y-4">
                <button class="w-full btn btn-primary py-3 text-base font-medium" onclick="window.location.href='login-smart.html'">
                    前往登入頁面
                </button>
                <button class="w-full btn btn-outline py-3 text-base font-medium" onclick="resendVerificationEmail()">
                    重新發送驗證郵件
                </button>
            </div>

            <!-- 聯絡資訊 -->
            <div class="mt-8 p-4 bg-gray-50 rounded-lg">
                <p class="text-sm text-gray-600 mb-2">需要協助嗎？</p>
                <div class="flex justify-center space-x-4 text-sm">
                    <a href="mailto:support@healthcare-system.com" class="text-blue-600 hover:text-blue-500">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        客服信箱
                    </a>
                    <a href="tel:0800-123-456" class="text-blue-600 hover:text-blue-500">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                        客服專線
                    </a>
                </div>
            </div>

            <!-- 系統資訊 -->
            <div class="mt-8 text-center text-xs text-gray-500">
                <p>© 2024 醫療監控系統. 保留所有權利.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="common.js"></script>
    <script>
        // 重新發送驗證郵件
        async function resendVerificationEmail() {
            const btn = event.target;
            const originalText = btn.textContent;
            
            try {
                btn.disabled = true;
                btn.innerHTML = '<div class="loading inline-block mr-2"></div>發送中...';
                
                // 模擬 API 調用
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                Utils.showNotification('驗證郵件已重新發送', 'success');
                
                // 設置60秒冷卻時間
                let countdown = 60;
                const interval = setInterval(() => {
                    btn.textContent = `重新發送 (${countdown}s)`;
                    countdown--;
                    
                    if (countdown < 0) {
                        clearInterval(interval);
                        btn.disabled = false;
                        btn.textContent = originalText;
                    }
                }, 1000);
                
            } catch (error) {
                console.error('重新發送失敗:', error);
                Utils.showNotification('發送失敗，請稍後再試', 'danger');
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        // 檢查 URL 參數，如果有 email 參數則顯示
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            
            if (email) {
                const emailSpan = document.createElement('span');
                emailSpan.className = 'font-medium text-blue-600';
                emailSpan.textContent = email;
                
                const emailText = document.querySelector('p:contains("信箱")');
                if (emailText) {
                    emailText.innerHTML = emailText.innerHTML.replace('您的信箱', `<span class="font-medium text-blue-600">${email}</span>`);
                }
            }
        });
    </script>
</body>
</html>
